<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">
  <!-- スマートフォンなどの画面幅に自動調整するレスポンシブ設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオサイト</title>
  <style>
    /* ========================================
       全体のリセットと基本設定
       ======================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* ワインレッドを基調とした大人な雰囲気を演出する背景とフォント設定 */
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #2b1d22;
      color: #f3e9ec;
      line-height: 1.8;
      padding: 20px;
    }

    /* ========================================
       メインコンテナ（中央寄せ・カード風レイアウト）
       ======================================== */
    .container {
      max-width: 750px;
      margin: 0 auto;
      background-color: #38242b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid #5c3a44;
    }

    /* ========================================
       ヘッダーエリア（名前とキャッチコピー）
       ======================================== */
    header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 25px;
      border-bottom: 1px solid #5c3a44;
    }

    header h1 {
      font-size: 2.2rem;
      color: #f7d6e0;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .catchphrase {
      font-size: 1.05rem;
      color: #d1a3b2;
      background-color: #452c35;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid #6b424f;
    }

    /* ========================================
       セクション共通のスタイル
       ======================================== */
    section {
      margin-bottom: 35px;
    }

    h2 {
      font-size: 1.3rem;
      color: #f7d6e0;
      margin-bottom: 15px;
      padding-left: 12px;
      border-left: 4px solid #a33355;
    }

    /* ========================================
       基本情報リストのスタイル
       ======================================== */
    .info-list {
      list-style: none;
      background-color: #2e1e24;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #4a3039;
    }

    .info-list li {
      padding: 8px 0;
      border-bottom: 1px solid #4a3039;
      font-size: 1rem;
    }

    .info-list li:last-child {
      border-bottom: none;
    }

    /* ========================================
       タグデザイン（趣味・プログラミング経験用）
       ======================================== */
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background-color: #4a2c37;
      color: #f3cbd7;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      border: 1px solid #6b424f;
    }

    /* ========================================
       テキストボックス（学びたいこと・ひとこと用）
       ======================================== */
    .text-box {
      background-color: #2e1e24;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #4a3039;
      font-size: 1rem;
      color: #e6d3d9;
    }

    /* ========================================
       フッターエリア
       ======================================== */
    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #5c3a44;
      font-size: 0.85rem;
      color: #a88892;
    }

    /* ========================================
       スマートフォン向けのレスポンシブ調整
       ======================================== */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 20px 15px;
      }

      header h1 {
        font-size: 1.7rem;
      }

      .catchphrase {
        font-size: 0.95rem;
        padding: 8px 14px;
      }

      h2 {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <!-- ページ全体のラッパー要素 -->
  <div class="container">

    <!-- ヘッダー：名前とキャッチコピーを表示 -->
    <header>
      <h1>蒼天</h1>
      <p class="catchphrase">サッカーや筋トレ好きです！ プログラミングは苦手だけどそれなりに頑張ってます。</p>
    </header>

    <main>
      <!-- 基本情報セクション -->
      <section>
        <h2>基本情報</h2>
        <ul class="info-list">
          <li><strong>名前：</strong>蒼天</li>
          <li><strong>学年：</strong>3年性</li>
          <li><strong>所属：</strong>拓殖大学工学部情報工学</li>
        </ul>
      </section>

      <!-- 趣味・好きなことセクション -->
      <section>
        <h2>趣味・好きなこと</h2>
        <div class="tag-container">
          <span class="tag">サッカー</span>
          <span class="tag">筋トレ</span>
          <span class="tag">温泉</span>
          <span class="tag">ダーツ</span>
          <span class="tag">カラオケ</span>
        </div>
      </section>

      <!-- プログラミング経験セクション -->
      <section>
        <h2>プログラミング経験</h2>
        <div class="tag-container">
          <span class="tag">java</span>
          <span class="tag">html/css/js</span>
          <span class="tag">python</span>
          <span class="tag">R言語</span>
          <span class="tag">Go言語</span>
          <span class="tag">sql</span>
        </div>
      </section>

      <!-- この授業で学びたいことセクション -->
      <section>
        <h2>この授業で学びたいこと</h2>
        <div class="text-box">
          <p>ossについて学びGitなどが扱えるようになる</p>
        </div>
      </section>

      <!-- ひとことセクション -->
      <section>
        <h2>ひとこと</h2>
        <div class="text-box">
          <p>まだまだプログラミングは雑魚だけどこれからも頑張って精進していきます。<br>あと可愛い年下彼女欲しい</p>
        </div>
      </section>
    </main>

    <!-- フッター：コピーライト -->
    <footer>
      <p>&copy; 2026 蒼天</p>
    </footer>

  </div>

</body>
</html>
